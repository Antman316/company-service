<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Company Service Companion</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .muted { color: #888; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .draft { background: #f59e0b14; border-color: #f59e0b66; }
  button { margin: 4px 6px 0 0; padding: 6px 10px; border-radius: 6px; border: 1px solid #8888; background: transparent; cursor: pointer; }
  button.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  #transcript { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11.5px; max-height: 40vh; overflow: auto; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0; }
  .err { color: #dc2626; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid #8888; }
</style>
</head>
<body>
  <h1>Company Service Companion</h1>
  <div id="status" class="muted">…</div>

  <div id="pair" class="card" hidden>
    <div>Pair with your Company Service account. Get a code from <b>Connections → Pair companion</b>.</div>
    <input type="text" id="code" placeholder="PAIRING CODE" autocomplete="off" maxlength="12">
    <button id="pairBtn" class="primary">Pair</button>
    <div id="pairErr" class="err"></div>
  </div>

  <div id="active" hidden>
    <div class="card" id="caseCard">
      <b id="company"></b> — <span id="caseStatus" class="pill"></span>
      <div id="rung" class="muted"></div>
    </div>
    <div class="card draft" id="draftCard" hidden>
      <div class="muted">Suggested reply (you send it — we never do):</div>
      <div id="draftBody"></div>
      <button id="insertBtn" class="primary">Insert into chat</button>
      <button id="regenBtn">Regenerate</button>
      <button id="sentBtn">I sent it</button>
    </div>
    <button id="watchBtn">Watch this chat area</button>
    <button id="wrapBtn">Save transcript</button>
    <div class="card"><div class="muted">Transcript tail:</div><div id="transcript"></div></div>
    <div id="msg" class="err"></div>
    <button id="unpairBtn">Unpair</button>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
